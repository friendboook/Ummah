<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফটো গ্যালারি - UMMMAH UNITED</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #e4e9f0 0%, #f7f9fb 100%); 
            color: #222; padding-bottom: 30px; 
        }
        
        /* --- প্রিমিয়াম থ্রিডি হেডার --- */
        .header { 
            background: linear-gradient(135deg, #0f5a34, #08381e); 
            padding: 25px 20px; text-align: center; 
            box-shadow: 0 5px 20px rgba(15, 90, 52, 0.4); 
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
        }
        .header h2 { margin: 0; color: #f4d160; font-size: 24px; text-shadow: 1px 2px 5px rgba(0,0,0,0.3); letter-spacing: 1px;}
        
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }

        /* --- ব্যাক বাটন --- */
        .back-btn { 
            display: flex; align-items: center; justify-content: center; gap: 8px; color: #ffffff; 
            background: linear-gradient(135deg, #1e293b, #0f172a); padding: 12px 25px; 
            border-radius: 30px; width: max-content; margin: 0 auto 20px auto; text-decoration: none; 
            font-weight: bold; font-size: 15px; box-shadow: 0 5px 15px rgba(15, 23, 42, 0.3); transition: 0.3s;
        }
        .back-btn:active { transform: scale(0.95); }

        /* --- গ্যালারি গ্রিড ডিজাইন --- */
        .grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; 
        }
        .img-card {
            background: #fff; padding: 5px; border-radius: 12px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.08); transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer; overflow: hidden;
        }
        .img-card:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .img-card img { 
            width: 100%; height: 140px; object-fit: cover; border-radius: 8px; display: block; 
        }

        /* --- ফুলস্ক্রিন ইমেজ প্রিভিউ (Modal) --- */
        .image-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.85); z-index: 99999; justify-content: center; align-items: center;
            backdrop-filter: blur(8px); opacity: 0; transition: opacity 0.3s ease;
        }
        .image-modal.show { opacity: 1; }
        .modal-content { position: relative; max-width: 95%; max-height: 85vh; }
        .modal-content img { 
            max-width: 100%; max-height: 85vh; border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); object-fit: contain; border: 2px solid #333;
        }
        .close-modal {
            position: absolute; top: -40px; right: 0; color: #fff; font-size: 35px; font-weight: bold; 
            cursor: pointer; line-height: 1; text-shadow: 0 2px 5px rgba(0,0,0,0.5); transition: 0.2s;
        }
        .close-modal:hover { color: #f4d160; transform: scale(1.1); }

    </style>
</head>
<body>
    <div class="header"><h2>🖼️ ফটো গ্যালারি</h2></div>
    
    <div class="container">
        <a href="home.html" class="back-btn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg> 
            হোমে ফিরে যান
        </a>
        
        <div class="grid" id="gallery-container">
            <p style="text-align:center; color:#777; font-weight:bold; grid-column: 1 / -1; margin-top:20px;">ছবি লোড হচ্ছে...</p>
        </div>
    </div>

    <!-- ফুলস্ক্রিন ইমেজ প্রিভিউ Modal -->
    <div class="image-modal" id="image-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <img id="modal-img" src="" alt="Full Preview">
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
        const db = getFirestore(initializeApp({ apiKey: "AIzaSyBOZk0sV04IXr3uLD9BlNUnndJ6LIfvHag", authDomain: "ummah-41fcf.firebaseapp.com", projectId: "ummah-41fcf" }));
        
        // ছবি বড় করার ফাংশন
        window.openModal = function(src) {
            const modal = document.getElementById('image-modal');
            document.getElementById('modal-img').src = src;
            modal.style.display = 'flex';
            setTimeout(() => { modal.classList.add('show'); }, 10);
        }

        // ছবি কেটে দেওয়ার ফাংশন
        window.closeModal = function() {
            const modal = document.getElementById('image-modal');
            modal.classList.remove('show');
            setTimeout(() => { 
                modal.style.display = 'none'; 
                document.getElementById('modal-img').src = ''; 
            }, 300);
        }

        // ডার্ক ব্যাকগ্রাউন্ডে ক্লিক করলেও যেন ছবি কেটে যায়
        document.getElementById('image-modal').addEventListener('click', function(e) {
            if(e.target === this) closeModal();
        });

        // ফায়ারবেস থেকে ছবি লোড
        onSnapshot(query(collection(db, "gallery"), orderBy("timestamp", "desc")), (snap) => {
            let html = ''; 
            snap.forEach(d => {
                const imgUrl = d.data().url;
                html += `
                <div class="img-card" onclick="openModal('${imgUrl}')">
                    <img src="${imgUrl}" alt="Gallery Image" loading="lazy">
                </div>`;
            });
            document.getElementById('gallery-container').innerHTML = html || '<p style="text-align:center; color:#777; grid-column: 1 / -1;">কোনো ছবি নেই</p>';
        });
    </script>
</body>
</html>
