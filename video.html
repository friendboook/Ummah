<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভিডিও - UMMMAH UNITED</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #e4e9f0 0%, #f7f9fb 100%); 
            color: #222; padding-bottom: 30px; 
        }
        .header { 
            background: linear-gradient(135deg, #f12711, #f5af19); 
            padding: 25px 20px; text-align: center; 
            box-shadow: 0 5px 20px rgba(241, 39, 17, 0.4); 
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
        }
        .header h2 { margin: 0; color: #fff; font-size: 24px; text-shadow: 1px 2px 5px rgba(0,0,0,0.3); }
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        
        .card { 
            background: #ffffff; padding: 15px; border-radius: 16px; margin-bottom: 25px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.06), inset 0 2px 0 rgba(255,255,255,1); 
            border: 1px solid rgba(241, 39, 17, 0.1); transition: 0.3s;
        }
        .card:hover { box-shadow: 0 12px 30px rgba(0,0,0,0.1); }
        .card h4 { margin: 0 0 12px 0; color: #333; font-size: 16px; font-weight: bold; text-align: center; }
        
        /* কাস্টম ভিডিও প্লেয়ার ডিজাইন */
        video { width: 100%; border-radius: 12px; background: #000; box-shadow: 0 5px 15px rgba(0,0,0,0.2); outline: none; }

        .back-btn { 
            display: flex; align-items: center; justify-content: center; gap: 8px; color: #ffffff; 
            background: linear-gradient(135deg, #1e293b, #0f172a); padding: 12px 25px; 
            border-radius: 30px; width: max-content; margin: 0 auto 20px auto; text-decoration: none; 
            font-weight: bold; font-size: 15px; box-shadow: 0 5px 15px rgba(15, 23, 42, 0.3); 
        }
    </style>
</head>
<body>
    <div class="header"><h2>🎥 ভিডিও লাইব্রেরি</h2></div>
    
    <div class="container">
        <a href="home.html" class="back-btn">⬅ হোমে ফিরে যান</a>
        <div id="list" style="text-align: center; color: #777; font-weight: bold; margin-top:20px;">ভিডিও লোড হচ্ছে...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
        const db = getFirestore(initializeApp({ apiKey: "AIzaSyBOZk0sV04IXr3uLD9BlNUnndJ6LIfvHag", authDomain: "ummah-41fcf.firebaseapp.com", projectId: "ummah-41fcf" }));

        onSnapshot(query(collection(db, "videos"), orderBy("timestamp", "desc")), (snap) => {
            let html = ''; 
            snap.forEach(d => {
                html += `
                <div class="card">
                    <h4>${d.data().title}</h4>
                    <video controls controlsList="nodownload" preload="metadata">
                        <source src="${d.data().link}" type="video/mp4">
                        <source src="${d.data().link}" type="video/webm">
                        আপনার ব্রাউজার ভিডিও সাপোর্ট করে না।
                    </video>
                </div>`;
            });
            document.getElementById('list').innerHTML = html || 'কোনো ভিডিও নেই';
        });
    </script>
</body>
</html>
