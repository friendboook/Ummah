<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোফাইল - UMMMAH UNITED ORGANISATION</title>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; background: linear-gradient(135deg, #05161a, #0a3629); color: white; }
        .profile-card {
            background: rgba(10, 30, 25, 0.8); border-radius: 15px; padding: 25px;
            max-width: 400px; margin: auto; border: 1px solid #d4af37; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        .profile-pic {
            width: 110px; height: 110px; border-radius: 50%; object-fit: cover;
            border: 3px solid #d4af37; margin-bottom: 10px;
        }
        .info-group { text-align: left; margin-bottom: 12px; }
        .info-group label { font-size: 12px; color: #d4af37; display: block; margin-bottom: 4px; }
        .info-group input {
            width: 100%; padding: 10px; border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 6px; background: rgba(255, 255, 255, 0.05); color: white; box-sizing: border-box;
        }
        .info-group input:read-only { color: #888; background: transparent; border: none; padding: 0; font-size: 16px; font-weight: bold; }
        
        button {
            background: linear-gradient(45deg, #b8860b, #ffd700); color: #111;
            border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .back-btn { background: #a81c1c; color: white; display: block; text-decoration: none; padding: 10px; border-radius: 6px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="profile-card">
        <img id="user-image" src="https://via.placeholder.com/110?text=No+Image" class="profile-pic" alt="Profile">
        
        <!-- ছবি আপলোড -->
        <input type="file" id="image-upload" accept="image/*" style="font-size: 10px; margin-bottom: 10px; width:100%;">
        <p id="upload-status" style="color: #8bc34a; font-size: 12px; margin-top:0;"></p>

        <!-- ইনফরমেশন ফর্ম -->
        <div class="info-group">
            <label>ফোন নাম্বার (অ্যাকাউন্ট আইডি)</label>
            <input type="text" id="p-phone" readonly>
        </div>
        <div class="info-group">
            <label>আপনার নাম</label>
            <input type="text" id="p-name" placeholder="নাম লিখুন">
        </div>
        <div class="info-group">
            <label>বাবার নাম</label>
            <input type="text" id="p-father" placeholder="বাবার নাম লিখুন">
        </div>
        <div class="info-group">
            <label>জন্মতারিখ</label>
            <input type="date" id="p-dob">
        </div>
        <div class="info-group">
            <label>ইমেইল অ্যাড্রেস</label>
            <input type="email" id="p-email" placeholder="example@mail.com">
        </div>
        <div class="info-group">
            <label>বর্তমান ঠিকানা</label>
            <input type="text" id="p-address" placeholder="গ্রাম/শহর, জেলা">
        </div>

        <button onclick="saveProfile()">তথ্য সেভ করুন</button>
        <a href="home.html" class="back-btn">হোমে ফিরে যান</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBOZk0sV04IXr3uLD9BlNUnndJ6LIfvHag", authDomain: "ummah-41fcf.firebaseapp.com", projectId: "ummah-41fcf" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loggedInPhone = localStorage.getItem("loggedInUser");
        if(!loggedInPhone) window.location.href = "index.html"; 

        // প্রোফাইল ডাটা লোড করা
        async function loadProfile() {
            const userSnap = await getDoc(doc(db, "users", loggedInPhone));
            if(userSnap.exists()) {
                const data = userSnap.data();
                document.getElementById('p-phone').value = data.phone || loggedInPhone;
                document.getElementById('p-name').value = data.fullName || '';
                document.getElementById('p-father').value = data.fatherName || '';
                document.getElementById('p-dob').value = data.dob || '';
                document.getElementById('p-email').value = data.email || '';
                document.getElementById('p-address').value = data.address || '';
                if(data.profilePic) document.getElementById('user-image').src = data.profilePic;
            }
        }
        loadProfile();

        // ডাটা আপডেট বা সেভ করা
        window.saveProfile = async function() {
            try {
                await updateDoc(doc(db, "users", loggedInPhone), {
                    fullName: document.getElementById('p-name').value,
                    fatherName: document.getElementById('p-father').value,
                    dob: document.getElementById('p-dob').value,
                    email: document.getElementById('p-email').value,
                    address: document.getElementById('p-address').value
                });
                alert("আপনার তথ্য সফলভাবে আপডেট হয়েছে!");
            } catch(e) { alert("তথ্য সেভ করতে সমস্যা হয়েছে।"); }
        }

        // ছবি আপলোড (ImgBB)
        document.getElementById('image-upload').addEventListener('change', async function() {
            if(this.files.length === 0) return;
            document.getElementById('upload-status').innerText = "ছবি আপলোড হচ্ছে...";
            const formData = new FormData(); formData.append("image", this.files[0]);
            
            try {
                const response = await fetch("https://api.imgbb.com/1/upload?key=9f5aeefecfb7dcb8325725caa75734a0", { method: "POST", body: formData });
                const data = await response.json();
                if(data.success) {
                    await updateDoc(doc(db, "users", loggedInPhone), { profilePic: data.data.url });
                    document.getElementById('user-image').src = data.data.url;
                    document.getElementById('upload-status').innerText = "ছবি সফলভাবে পরিবর্তন হয়েছে!";
                }
            } catch(e) { document.getElementById('upload-status').innerText = "আপলোড ফেইল হয়েছে!"; }
        });
    </script>
</body>
</html>
