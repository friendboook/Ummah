<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মতামত গ্রুপ - UMMMAH UNITED</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #05161a; color: white; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #0a3629; padding: 15px; border-bottom: 1px solid #d4af37; display: flex; align-items: center; justify-content: space-between; }
        .header h3 { margin: 0; color: #ffeb3b; }
        .back-btn { color: #fff; text-decoration: none; font-size: 14px; background: #a81c1c; padding: 5px 10px; border-radius: 4px; }
        
        /* চ্যাট এরিয়া */
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px; border-radius: 10px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .msg-name { font-size: 10px; font-weight: bold; margin-bottom: 3px; color: #ffeb3b; }
        
        .msg-other { background: rgba(255,255,255,0.1); border-top-left-radius: 0; align-self: flex-start; border: 1px solid rgba(212,175,55,0.3); }
        .msg-me { background: #1e7a1e; border-top-right-radius: 0; align-self: flex-end; }
        
        /* ইনপুট এরিয়া */
        .input-area { display: flex; padding: 10px; background: #0a3629; border-top: 1px solid #d4af37; }
        .input-area input { flex: 1; padding: 12px; border-radius: 20px; border: none; outline: none; margin-right: 10px; font-size: 14px; }
        .input-area button { background: #d4af37; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 18px; }
    </style>
</head>
<body>

    <div class="header">
        <a href="home.html" class="back-btn">⬅ হোম</a>
        <h3>💬 মতামত গ্রুপ</h3>
    </div>

    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="msg-input" placeholder="আপনার মতামত লিখুন...">
        <button onclick="sendMessage()">➤</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBOZk0sV04IXr3uLD9BlNUnndJ6LIfvHag", authDomain: "ummah-41fcf.firebaseapp.com", projectId: "ummah-41fcf" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const myPhone = localStorage.getItem("loggedInUser");
        let myName = "Member";

        // নিজের নাম বের করা
        async function getUserName() {
            const snap = await getDoc(doc(db, "users", myPhone));
            if(snap.exists()) myName = snap.data().fullName;
        }
        getUserName();

        const chatBox = document.getElementById('chat-box');

        // রিয়েল-টাইম মেসেজ লোড
        const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
        onSnapshot(q, (snapshot) => {
            chatBox.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const isMe = data.phone === myPhone;
                chatBox.innerHTML += `
                    <div class="msg ${isMe ? 'msg-me' : 'msg-other'}">
                        ${!isMe ? `<div class="msg-name">${data.name}</div>` : ''}
                        <div>${data.text}</div>
                    </div>
                `;
            });
            chatBox.scrollTop = chatBox.scrollHeight; // স্ক্রল নিচে রাখা
        });

        window.sendMessage = async function() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text) return;
            
            input.value = ''; // ইনপুট ক্লিয়ার
            await addDoc(collection(db, "messages"), {
                phone: myPhone,
                name: myName,
                text: text,
                timestamp: Date.now()
            });
        }
    </script>
</body>
</html>
